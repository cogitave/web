# Deploy — cogitave.com.
#
# Builds the static bundle and uploads it to Cloudflare Pages. Only `main`
# deploys; a pull request builds under ci.yml and stops there.
#
# WHAT A HUMAN HAS TO DO ONCE, before this can run
# ------------------------------------------------
# This workflow deliberately holds no credentials. Add these in
# Settings -> Secrets and variables -> Actions:
#
#   secret   CLOUDFLARE_API_TOKEN    a token scoped to "Cloudflare Pages: Edit"
#                                    for the account below, and nothing else
#   secret   CLOUDFLARE_ACCOUNT_ID   the Cloudflare account id
#   variable CLOUDFLARE_PAGES_PROJECT  the Pages project name
#                                      (defaults to cogitave-web)
#
# The token is least-privilege on purpose: Pages:Edit cannot touch DNS, Workers,
# or the zone. Rotate it on the schedule in the security standard; nothing here
# needs changing when you do.
#
# Why wrangler is acceptable here even though the estate builds from scratch:
# ADR-0003 governs what ships and what the BUILD depends on - the bundle this
# uploads still has zero runtime dependencies. wrangler is the provider's own CLI
# used at deploy time, in the same category as `git` or `node` themselves, and it
# never enters the artifact. Moving provider means editing this file only.

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

# One deploy at a time, and never cancel one midway: a half-uploaded site is
# worse than a slightly stale one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://cogitave.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Build before touching the deploy credentials: a failing build must never
      # reach the step that can change what the public sees.
      - name: Build
        run: npm run check

      - name: Refuse to deploy an app that is not live
        run: |
          if grep -qE '^\s+status: (planned|staged)\s*(#.*)?$' site.config.yaml; then
            echo "::error::an app in the registry is still planned/staged - promote it or remove it before deploying"
            grep -nE '^\s+(- id|status):' site.config.yaml
            exit 1
          fi
          echo "every registered app is live"

      # Fail with the reason rather than with wrangler's "authentication error".
      # A deploy that cannot run because it was never configured should say so in
      # one line, not send someone reading provider docs.
      - name: Credentials are configured
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          missing=0
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "  MISSING  secret   CLOUDFLARE_API_TOKEN   — scope it to Cloudflare Pages -> Edit, nothing else"
            missing=1
          fi
          if [ "$HAS_ACCOUNT" != "true" ]; then
            echo "  MISSING  secret   CLOUDFLARE_ACCOUNT_ID  — the Cloudflare account id"
            missing=1
          fi
          if [ "$missing" = "1" ]; then
            echo "::error::deploy is not configured. Add the secrets listed above under Settings -> Secrets and variables -> Actions, then re-run: Actions -> deploy -> Run workflow. Nothing was deployed."
            exit 1
          fi
          echo "credentials present"

      # Resolve the target by the domain it must serve, not by a name someone
      # typed. Deploying to a project name is how a deploy silently succeeds into
      # an orphan project while the live site never changes - the name can be
      # wrong and nothing says so. The domain cannot be wrong: either a project
      # serves cogitave.com or none does, and the latter is worth failing on.
      #
      # CLOUDFLARE_PAGES_PROJECT stays as an explicit override for the
      # first-ever deploy, before any project owns the domain.
      - name: Resolve the Pages project that serves the site
        id: project
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OVERRIDE: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          SITE_DOMAIN: cogitave.com
        run: |
          set -euo pipefail

          # No `curl -f`: it swallows the response body, which is where Cloudflare
          # puts the reason. Read the API's own success flag instead and surface
          # its message - the errors are about the request, not about the
          # account's contents, so they are safe to print in a public log.
          projects=$(curl -sS \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects")

          if [ "$(printf '%s' "$projects" | jq -r '.success // false')" != "true" ]; then
            echo "::error::the Cloudflare API refused the project listing: $(printf '%s' "$projects" | jq -rc '[.errors[]? | "\(.code): \(.message)"] | join("; ")')"
            exit 1
          fi

          # The project whose custom domains include the site domain.
          name=$(printf '%s' "$projects" \
            | jq -r --arg d "$SITE_DOMAIN" '[.result[] | select((.domains // []) | index($d)) | .name][0] // ""')

          if [ -n "$name" ]; then
            echo "resolved by domain: $SITE_DOMAIN is served by Pages project \"$name\""
          elif [ -n "${OVERRIDE:-}" ] && printf '%s' "$projects" | jq -e --arg n "$OVERRIDE" '.result[] | select(.name == $n)' >/dev/null; then
            name="$OVERRIDE"
            echo "::warning::no Pages project serves $SITE_DOMAIN yet; falling back to CLOUDFLARE_PAGES_PROJECT=\"$name\". This deploy will publish to that project's *.pages.dev URL, and $SITE_DOMAIN will NOT change until the custom domain is attached to it."
          else
            # Nothing serves the domain and the named project does not exist, so
            # this is a first deploy into an empty account. Create the project
            # rather than stopping: it is idempotent, it publishes to a
            # *.pages.dev URL, and it changes nothing a visitor sees. Attaching
            # the custom domain stays a deliberate human step, because THAT is
            # the moment the live site changes and it can break whatever serves
            # it today.
            name="${OVERRIDE:-cogitave-web}"
            echo "no Pages project serves $SITE_DOMAIN and \"$name\" does not exist yet - creating it"

            created=$(curl -sS -X POST \
              -H "Authorization: Bearer $CF_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data "{\"name\":\"$name\",\"production_branch\":\"main\"}" \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects")

            if [ "$(printf '%s' "$created" | jq -r '.success // false')" != "true" ]; then
              echo "::error::could not create the Pages project \"$name\": $(printf '%s' "$created" | jq -rc '[.errors[]? | "\(.code): \(.message)"] | join("; ")')"
              exit 1
            fi

            echo "::warning::created Pages project \"$name\". This deploy publishes to https://$name.pages.dev/ — $SITE_DOMAIN will NOT change until you attach it as a custom domain to that project."
            echo "FIRST_DEPLOY=1" >> "$GITHUB_ENV"
          fi

          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy _site
            --project-name=${{ steps.project.outputs.name }}
            --branch=main
            --commit-dirty=true

      # Point the domain at what we just published. This runs only on a first
      # deploy - once the domain is attached, the resolve step finds the project
      # by domain and this is skipped forever. It runs AFTER the deploy on
      # purpose: the project already serves the new site, so the cutover is
      # domain -> working site, never domain -> empty project.
      - name: Attach the custom domain
        if: env.FIRST_DEPLOY == '1'
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ steps.project.outputs.name }}
          SITE_DOMAIN: cogitave.com
        run: |
          set -uo pipefail
          attached=$(curl -sS -X POST \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data "{\"name\":\"$SITE_DOMAIN\"}" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$PROJECT/domains")

          if [ "$(printf '%s' "$attached" | jq -r '.success // false')" = "true" ]; then
            echo "::notice::$SITE_DOMAIN attached to \"$PROJECT\". DNS may take a few minutes to propagate."
          else
            # Not fatal: the deploy itself succeeded and is live on *.pages.dev.
            # Attaching needs DNS rights the deploy token may not carry, and it
            # is the one step a human can finish in the dashboard in seconds.
            echo "::warning::could not attach $SITE_DOMAIN automatically: $(printf '%s' "$attached" | jq -rc '[.errors[]? | "\(.code): \(.message)"] | join("; ")'). The new site IS live on https://$PROJECT.pages.dev/ — attach the domain to that project in the Cloudflare dashboard to switch $SITE_DOMAIN over."
          fi

      # Deploying is not the same as being live. Check the thing a visitor gets -
      # at the URL this deploy can actually affect. On a first deploy the custom
      # domain may not be attached yet, so checking cogitave.com would fail for a
      # reason that has nothing to do with whether the deploy worked.
      - name: Verify the deployed site actually serves
        env:
          PROJECT: ${{ steps.project.outputs.name }}
        run: |
          if [ "${FIRST_DEPLOY:-0}" = "1" ]; then
            target="https://$PROJECT.pages.dev"
            echo "first deploy: verifying $target (cogitave.com is not attached to this project yet)"
          else
            target="https://cogitave.com"
          fi

          sleep 20
          for attempt in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$target/namzu/" || true)
            if [ "$code" = "200" ]; then
              echo "$target/namzu/ is serving (200)"
              if [ "${FIRST_DEPLOY:-0}" = "1" ]; then
                echo "::notice::The new site is live at $target — but cogitave.com still serves the old one. Attach cogitave.com as a custom domain to the \"$PROJECT\" Pages project to switch it over."
              fi
              exit 0
            fi
            echo "attempt $attempt: /namzu/ returned $code, retrying"
            sleep 15
          done
          echo "::error::the deploy reported success but $target/namzu/ is not serving"
          exit 1
