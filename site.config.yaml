# site.config.yaml — the web platform shell config (single source for the marketing core)
# ----------------------------------------------------------------------------
# This is the *core/shell* config. Individual apps/landing pages/campaigns drop
# into apps/<slug>/ with their own app.manifest.json; this file wires them to
# routes, domains, render targets, and shared concerns. Valid YAML; schema-gated
# in CI alongside each app.manifest.json (see apps/app.manifest.schema.json).
#
# Estate note: the lead wires self/estate.yaml + self/domains.yaml. This file is
# the *property-local* config for the `marketing-site` property; it must stay
# consistent with domains.yaml (cogitave.com / www -> marketing-site) and never
# contradict it.
# ----------------------------------------------------------------------------

version: 0

property:
  name: marketing-site                 # matches self/domains.yaml `properties[].name`
  description: "Cogitave corporate landing + marketing/campaign shell."
  owner: cogitave/web

# --- Domain mapping ---------------------------------------------------------
# Mirrors self/domains.yaml (DNS-as-code is canonical there). cogitave.com (apex)
# and www both resolve to this property. learn.cogitave.com / docs.cogitave.com
# are a SEPARATE property (learn-platform, built from public/learn) — we only
# cross-link to it; we never own its routes.
domains:
  primary: cogitave.com
  aliases:
    - host: www
      action: redirect                 # canonicalize www -> apex (one canonical origin for SEO)
      to: cogitave.com
  related:
    - host: learn.cogitave.com
      property: learn-platform
      relation: cross-link             # owned by public/learn; linked, not routed here
    - host: docs.cogitave.com
      property: learn-platform
      relation: cross-link
  canonicalOrigin: "https://cogitave.com"

# --- Build / deploy targets -------------------------------------------------
# Multi-cloud-portable by construction: output is a standard static bundle + a
# portable edge-function contract (request -> response), so the same artifact
# deploys to any of the targets below. The renderer is ours (build-from-scratch);
# the platforms are deploy substrate, not a lock-in.
build:
  engine:
    build: { name: namzu, language: typescript, phase: build }   # produces the static + edge bundle
    serve: { name: yuva, language: rust, phase: serve }          # edge/runtime serve
    decoupled: true
  # Per-route rendering spectrum (2026 hybrid model): static-first, islands for
  # interactivity, edge SSR only where personalization/freshness demands it.
  renderModes: [static, island, edge-ssr]
  defaultRenderMode: static
  output:
    static: { dir: "_site/" }          # prerendered HTML + assets (CDN-cacheable)
    edge:   { dir: "_edge/", contract: "request-response" }  # portable edge handler
    assets: { dir: "_site/assets/", immutable: true, hashedFilenames: true }
  designTokens:
    source: design/tokens.json         # single source; transformed to CSS vars at build
    format: dtcg                        # W3C Design Tokens Community Group format
    emit: [css-vars, json]
  budgets:
    # Core Web Vitals budgets enforced in CI (perf-first ethos).
    lcpMs: 2500
    cls: 0.1
    inpMs: 200
    jsKbPerRoute: 120

deploy:
  strategy: edge-first                 # static at CDN edge; edge-ssr functions co-located
  multiCloud: true
  targets:
    # Provider-agnostic list; selection is an infra concern (internal/infra). Each
    # consumes the same `build.output` artifact via the portable edge contract.
    - name: primary
      kind: static                     # the build emits a plain static bundle
      provider: cloudflare-pages       # continuity: cogitave.com already resolves to Cloudflare
      project: cogitave-web            # Pages project; override with the CLOUDFLARE_PAGES_PROJECT repo variable
      regionByAudience: true
      note: >-
        Named because a deploy has to point somewhere, not because we are locked
        in. The pipeline uploads `build.output.static` as-is, so moving provider
        is a change to .github/workflows/deploy.yml and nothing else - no build
        output, config or content changes with it.
    - name: failover
      kind: static
      provider: TBD                    # unset until there is a second target to fail over to
  immutableReleases: true              # content-addressed; atomic promote + instant rollback
  cdn:
    cacheControl: "public, max-age=0, s-maxage=31536000, stale-while-revalidate=86400"
    purge: on-merge

# --- Apps registry ----------------------------------------------------------
# THE SLOT. An app/page/campaign is a folder under apps/ that contains an
# app.manifest.json. Discovery is automatic (any apps/<slug>/app.manifest.json is
# picked up); this registry PINS route, property, and status, and is the place to
# stage/feature-flag a drop-in. Keep entries sorted; one line per app.
apps:
  discovery:
    glob: "apps/*/app.manifest.json"
    exclude: ["apps/_template/**"]
  registry:
    - id: corporate-landing
      manifest: apps/corporate-landing/app.manifest.json   # the homepage
      route: "/"
      property: marketing-site
      status: live                      # planned | staged | live | archived
      # The gates that held this at `staged` are closed: prices project from the
      # corp/gtm registry, the quantitative claims carry their benchmark
      # attribution, and the platform strip states a fact rather than a partner
      # claim. Payment collection is NOT part of this app (ADR-0004), and the
      # "pay here" link stays withheld until pay.cogitave.com answers.
    - id: namzu-solutions
      manifest: apps/namzu-solutions/app.manifest.json
      route: /namzu
      property: marketing-site
      status: live
      # The customer presentation, ported out of a standalone HTML file into the
      # content model. Its old URL redirects here (see `redirects` below).
    # Drop new campaigns/landing pages here, e.g.:
    # - { id: launch-yuva-2, manifest: apps/launch-yuva-2/app.manifest.json, route: /yuva-2, property: marketing-site, status: staged }

# --- Redirects --------------------------------------------------------------
# A URL we have published is a promise. When a page moves, the old address keeps
# working rather than becoming a 404 in someone's email or slide deck.
# The build emits a canonical + meta-refresh stub per entry so redirects work on
# any static host; a host that supports real 301s should serve these as 301s.
redirects:
  - from: /namzu-otonom-ajan-cozumleri
    to: /namzu/
    reason: "The presentation moved into the app model; the old path was Turkish-named and served the Turkish deck."
  - from: /namzu-otonom-ajan-cozumleri.html
    to: /namzu/
    reason: "The same page as served directly from the old static file."

# --- Shared concerns (defaults inherited by every app; an app may override) --
content:
  model: content-as-data               # typed, schema-validated YAML; see content/README.md
  schema: content/schemas/page.schema.json
  root: apps/*/content
seo:
  conventions: seo/README.md
  sitemap: { generate: true, path: /sitemap.xml }
  robots: seo/robots.txt
  structuredData: { format: json-ld, dir: seo/structured-data }
  llmsTxt: { generate: true, path: /llms.txt }   # curated AI-crawler table of contents
analytics:
  provider: privacy-first              # cookieless by default; no PII; see analytics/README.md
  consent: analytics/consent.config.json
i18n:
  # Locale handling is fixed by docs/decisions/0003-locale-routing.md. Read it
  # before changing anything here; each field below is a decided constraint.
  strategy: single-url                 # ONE endpoint per page. There is no /tr/ or
                                       # /en/ segment and no locale route: every
                                       # locale ships inside the same document and
                                       # the switcher toggles which one is shown.
  primaryLocale: tr                    # paints first; also the document's `lang`
  locales: [tr, en]                    # authored order = display order in the switcher
  autoRedirect: false                  # never redirect or swap content on
                                       # Accept-Language, IP or cookie - the URL a
                                       # visitor requested is the URL they get
  persistChoice: localStorage          # the visitor's pick is remembered, not guessed
  canonical: self                      # one URL per page, canonical for itself
  # No hreflang: hreflang describes a set of ALTERNATE URLs, and there is only one
  # URL per page here. Emitting it would be a claim about routes that do not exist.
a11y:
  standard: WCAG-2.2-AA
  notes: a11y/README.md

# --- Environment / secrets --------------------------------------------------
# No secrets in this repo. Config is read from the environment; encrypted values
# are committed as .env (ciphertext) via dotenvx (ECIES/AES-256), with the private
# key held only in the deploy secret store — never in git, never in agent context.
env:
  loader: dotenvx
  encryptedFile: .env                  # committed as ciphertext (safe to commit)
  publicKeyVar: DOTENV_PUBLIC_KEY      # in-repo, encrypts
  privateKeyVar: DOTENV_PRIVATE_KEY    # injected at deploy from the secret store only
  vars:
    - { name: SITE_BASE_URL, required: true, example: "https://cogitave.com" }
    - { name: ANALYTICS_INGEST_URL, required: false, secret: false }
    - { name: ANALYTICS_API_KEY, required: false, secret: true }
