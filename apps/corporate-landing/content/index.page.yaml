  - type: product-grid
    id: products
    data:
      label: Ürünlerimiz
      products:
        - id: yuva
          category: Ajan İşletim Sistemi
          name: yuva
          slogan: İnsanlar için değil, yalnızca ajanlar için.
          body: >-
            Ajanların planlandığı, yetkilendirildiği ve gözlemlendiği işletim
            katmanı. Kaynak, kimlik ve yetki tek sistemde.
          stat:
            value: 11,1×
            label: aynı konuk, aynı makinede Firecracker'a göre ilk komuta bu kadar hızlı ulaşır
            evidence:
              href: https://github.com/cogitave/yuva/blob/main/docs/BENCHMARKS.md
              label: Yöntem ve ölçülen değerler
          features:
            - Ajan yaşam döngüsü ve zamanlama
            - Kimlik ve yetki modeli
            - Uçtan uca gözlemlenebilirlik
            - Çıplak donanımda veya KVM konuğu olarak çalışır
          tag: Açık kaynak
        - id: namzu
          category: Ajan Çekirdeği
          name: namzu
          slogan: Her ajanın altında aynı çekirdek.
          body: >-
            Açık kaynak ajan çekirdeği. Tam kontrol sizde: dış bağımlılık olmadan
            kurumsala kurulur ve uyarlanır. Üzerine kendi arayüzünüzü koyun,
            çalışsın.
          stat:
            value: "0"
            label: SDK ve sandbox paketlerinde çalışma zamanı bağımlılığı
            evidence:
              href: https://github.com/cogitave/namzu
              label: Paket manifestlerinden doğrulayın
          features:
            - Çekirdek seviyesinde kontrol
            - Kurumsala uyarlanabilir ve özelleştirilebilir
            - Her arayüzün altına takılır
          tag: Açık kaynak
        - id: cogi
          category: Orkestratör Ajan
          name: cogi
          slogan: Şirketinizi tanıyan ajan.
          body: >-
            Tam otonom orkestratör: şirketinizi kullanımınızdan öğrenir, kendi
            adaptörünü eğitir ve kendi modelini damıtır.
          stat:
            value: ∞
            label: siz kullandıkça kendi modelini eğitmeye devam eder
            qualitative: true
          features:
            - Tam otonom orkestrasyon
            - Kullanımdan kendi adaptörünü çıkarır
            - Kendi modelini damıtır ve dağıtır
          tag: Yakında

  - type: research-list
    id: research
    data:
      label: Araştırma
      moreLabel: Tüm yazılar yakında — learn.cogitave.com
      moreHref: https://learn.cogitave.com
      articles:
        - date: 2026-07
          tag: Ajanlar
          title: Kendi adaptörünü eğiten ajan — cogi'nin otonom öğrenme döngüsü
          excerpt: Kullanım verisinden sürekli öğrenen bir orkestratör: damıtma hattı, değerlendirme kapıları ve güvenli dağıtım stratejisi.
        - date: 2026-06
          tag: Sistemler
          title: yuva'da soğuk başlatma — sıfırdan yazılmış bir çekirdeğin hiç ödemediği bedel
          excerpt: Ajan işletim sisteminde milisaniyelik başlatmaya nasıl ulaştığımız ve rakamları kıyaslanabilir tutan ölçüm yöntemi.
        - date: 2026-05
          tag: Mimari
          title: Bir ajan çekirdeği neden bağımlılıksız olmalı?
          excerpt: namzu'nun tasarım ilkeleri — çekirdek sizde, arayüz sizin, kontrol sizde. Kurumsalda lock-in olmadan ajan altyapısı.
        - date: 2026-04
          tag: Endüstriyel
          title: Edge-otonom filolarda telemetri ve veri bütünlüğü
          excerpt: Bağlantı koptuğunda da çalışan saha cihazları: yerel karar, kuyruklu senkron ve endüstriyel ortamda izlenebilirlik desenleri.

