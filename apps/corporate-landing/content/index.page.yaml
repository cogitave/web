title: Cogitave — Ajanlar İçin Yapay Zekâ
description: Cogitave, ajan yığınını sıfırdan inşa eden bir yapay zekâ stüdyosu — ajan işletim sistemi yuva, açık kaynak ajan çekirdeği namzu ve orkestratör ajan cogi; artı bunları üretime taşıyan hizmetler.
locale: tr
seo:
  metaTitle: Cogitave | Ajanlar İçin Yapay Zekâ
  metaDescription: Ajan işletim sistemi yuva, açık kaynak çekirdek namzu ve orkestratör ajan cogi. Üretken yapay zekâ geliştirme, GPU model barındırma, endüstriyel IoT ve güvenlik mühendisliği — Kocaeli merkezli bir stüdyodan.
  ogImage: /assets/brand/og.png
  structuredData:
    - organization
